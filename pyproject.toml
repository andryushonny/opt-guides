[project]
name = "opt-guides"
version = "0.1.0"
description = "Hands-on optimization exercise: SA from scratch, then BO comparison."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "scikit-optimize>=0.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["targets*", "solvers*"]
